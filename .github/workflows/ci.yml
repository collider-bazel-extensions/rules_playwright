name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: bazel test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host prereqs
        # rules_itest builds a small C sentinel (`exit0`) that needs g++/libstdc++-dev
        # because Bazel's default cc toolchain links libstdc++ even for pure-C binaries.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends g++ libstdc++-12-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable pnpm

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Install npm deps
        run: pnpm install --frozen-lockfile

      - name: A test PATH without node (the rules run the rules_nodejs toolchain's)
        # Bazel itself (bazelisk from npm) and pnpm keep the host node; the
        # tests get /usr/bin minus node / npx / npm.
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/path-without-node"
          mkdir -p "$d"
          for f in /usr/bin/*; do
            case "$(basename "$f")" in node|nodejs|npx|npm|corepack) continue ;; esac
            ln -s "$f" "$d/"
          done
          if PATH="$d" command -v node; then echo "node still on the test PATH" >&2; exit 1; fi
          echo "TEST_PATH=$d" >> "$GITHUB_ENV"

      - name: bazel test //...
        run: bazel test //... --test_tag_filters=-manual --test_output=errors --test_env=PATH="$TEST_PATH"

      - name: A mismatched @playwright/test fails the build
        run: |
          if bazel build //tests/version_check:mismatch 2> mismatch.out; then
            echo "//tests/version_check:mismatch built" >&2; exit 1
          fi
          grep -F 'has @playwright/test 1.50.0 in `data`, but the Playwright toolchain is pinned to 1.49.0' mismatch.out
          bazel build //tests/version_check:match

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs
          path: bazel-testlogs/
          if-no-files-found: ignore

  consumer:
    # rules_playwright as a dependency, from the commit's release archive: a
    # root without playwright.version() resolves; repeated / unsupported /
    # conflicting tags; tests/ and examples/ not shipped; node comes from
    # rules_nodejs's default toolchain.
    name: consumer (ubuntu-latest, git archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Consumer checks
        run: .github/consumer/check.sh "$RUNNER_TEMP/consumer"

  multi_browser:
    name: bazel test (ubuntu-22.04, firefox + webkit + chromium)
    # Pin ubuntu-22.04 to match the firefox + webkit bundle variants
    # (private/versions.bzl pins firefox-ubuntu-22.04.zip + webkit-ubuntu-22.04.zip).
    # ubuntu-latest's running Jammy at the time of v0.2.0 — still pin
    # explicitly so a future ubuntu-latest bump doesn't silently break the
    # cell.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host prereqs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends g++ libstdc++-12-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable pnpm

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-multi-browser
          repository-cache: true

      - name: Install npm deps
        run: pnpm install --frozen-lockfile

      # firefox + webkit need OS-level libs (libnss, libxkbcommon, libwoff,
      # etc.). Playwright's `install-deps` subcommand encapsulates the apt
      # invocation for the distros it supports; we use `npx playwright` not
      # the bazel-wrapped binary because this runs once at host-setup time,
      # not under test action sandboxing.
      - name: Install Playwright OS deps for firefox + webkit
        run: npx --yes playwright@1.49.0 install-deps firefox webkit

      - name: bazel test //tests:smoke_multi_browser_test
        # Explicit named reference bypasses the `manual` wildcard filter.
        # The test_suite expands to the three per-browser children.
        run: bazel test //tests:smoke_multi_browser_test --test_output=errors

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-multi-browser
          path: bazel-testlogs/
          if-no-files-found: ignore
